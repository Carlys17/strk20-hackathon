name: Index projects

# projects.json is what the hub at strk20.starknet.io/hackathon fetches. It is
# rebuilt on a 30-minute cron so activity stays fresh during the sprint, and on
# every push to main so a merged registration PR appears within a minute.
on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths:
      - registry.json
      - scripts/build-projects.mjs
      - .github/workflows/index-projects.yml
  workflow_dispatch:

# The job commits projects.json back to main.
permissions:
  contents: write

# A cron tick landing on top of a merge would race for the same commit.
concurrency:
  group: index-projects
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The retention gate below reads every past version of registry.json.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # projects.json is what the hub renders, so this is the last place a lost
      # project can be caught before it disappears from the table. If a merge
      # dropped someone, the build is skipped and the table keeps serving the
      # last good file until registry.json is fixed.
      - name: Refuse to publish a registry that lost a project
        env:
          HISTORY_REF: HEAD
          # Used to tell a renamed repository from a removed one.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-registry-retention.mjs

      - name: Build projects.json
        env:
          # Repo-scoped token: 1,000 requests/hour, against roughly 120 per run.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without this the run still succeeds - it just silently produces no
          # summaries, which is exactly how it went unnoticed the first time.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/build-projects.mjs

      - name: Commit if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          git config user.name  "strk20-sprint-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Registrations land on main while this is running, so the push can
          # lose a race - and did, dropping a rebuild that had already been
          # computed.
          #
          # What it must not do is rebuild blindly on every rejection. At sixty
          # projects a rebuild is several hundred API calls, and a retry that
          # repeats them walked straight into the hourly rate limit, losing the
          # result it was trying to save. projects.json is derived from
          # registry.json alone: if that file is unchanged on the newer main,
          # the one already built is still the right answer and only needs
          # replaying on top. A rebuild is only for when the registry itself
          # moved - a registration landed - and then only once.
          cp projects.json "$RUNNER_TEMP/built.json"
          base_registry=$(git rev-parse HEAD:registry.json)
          rebuilt=0

          for attempt in 1 2 3; do
            git add projects.json
            # No push activity since the last tick is the common case - exit
            # quietly rather than creating an empty commit every 30 minutes.
            if git diff --cached --quiet; then
              echo "no changes"
              exit 0
            fi

            git commit -q -m "chore: reindex projects [skip ci]"
            if git push; then
              echo "published on attempt $attempt"
              exit 0
            fi

            git fetch --quiet origin main && git reset --hard --quiet origin/main

            if [ "$(git rev-parse HEAD:registry.json)" = "$base_registry" ]; then
              echo "main moved but the registry did not - replaying the build already done"
              cp "$RUNNER_TEMP/built.json" projects.json
            elif [ "$rebuilt" = "0" ]; then
              echo "a registration landed - rebuilding once on top of it"
              rebuilt=1
              node scripts/build-projects.mjs || exit 1
              cp projects.json "$RUNNER_TEMP/built.json"
              base_registry=$(git rev-parse HEAD:registry.json)
            else
              echo "the registry moved again - leaving it for the next tick"
              exit 0
            fi
          done

          echo "main kept moving - leaving it for the next tick"
          exit 1
