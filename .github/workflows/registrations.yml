name: Registrations

# Applies open registration pull requests to main, unattended.
#
# Registration is an append to a single JSON array, so the moment one pull
# request lands, every other one conflicts. Left to contributors, that conflict
# gets resolved in the web editor by taking one side of the file, which drops a
# project that was already accepted - it has happened once already. So the
# resolution is done here instead: main's registry, plus whatever the branch
# added. There is no judgement in that, only bookkeeping.
#
# Nothing is pushed to a contributor's branch. That was the first design, and
# GITHUB_TOKEN cannot do it: merging main into a fork branch carries main's
# workflow files with it, and a token without the `workflows` scope - which no
# GITHUB_TOKEN has - is refused. So the resolved registry is committed straight
# to main, crediting the author, and the pull request is closed pointing at the
# commit. Contributors never touch a conflict either way.
#
# Nothing here reads the application. The checks are about the shape of the file,
# not about whether a project belongs in the sprint. A maintainer stops one with
# the "hold" label, or reverts it from main afterwards.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - registry.json
  push:
    branches: [main]
    paths:
      - registry.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Asking for the projects.json rebuild at the end is a workflow dispatch.
  actions: write

# Every run commits to main, so two of them at once would race for the same ref.
concurrency:
  group: registrations
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Always the base repository, never a pull request's code. The working
      # tree stays on main for the whole run - branches are read as data with
      # git show, never checked out, so nothing from a fork is ever executed.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The default shell is bash -e, and almost every command in this loop
          # is allowed to fail: a branch that cannot be read, a validation that
          # rejects, a push that loses a race. One pull request going wrong must
          # not take the rest of the run with it.
          set +e
          set -uo pipefail

          # A registration landing on main invalidates every other open branch,
          # so that case fans out. A pull request event only concerns itself.
          if [ "$EVENT" = "pull_request_target" ]; then
            numbers="$PR"
          else
            numbers=$(gh pr list --state open --base main --limit 100 --json number --jq '.[].number')
          fi
          [ -z "${numbers// /}" ] && { echo "no open registration pull requests"; exit 0; }

          git config user.name  "strk20-sprint-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          applied=0
          for n in $numbers; do
            echo "::group::PR #$n"

            meta=$(gh pr view "$n" --json files,labels,isDraft,state,author)
            if [ "$(jq -r '.state' <<< "$meta")" != "OPEN" ] || [ "$(jq -r '.isDraft' <<< "$meta")" = "true" ]; then
              echo "not an open, ready pull request - skipped"; echo "::endgroup::"; continue
            fi

            # Applying it for them is only safe when registry.json is the whole
            # change. A branch that also touches scripts or workflows is a
            # maintainer's problem, not a bookkeeping one.
            touched=$(jq -r '[.files[].path] | sort | join(",")' <<< "$meta")
            if [ "$touched" != "registry.json" ]; then
              echo "touches $touched - not a plain registration, skipped"; echo "::endgroup::"; continue
            fi

            # Registrations land on their own. The only thing that stops one is
            # a maintainer putting "hold" on it - worth doing the moment
            # something looks like spam, because a revert is the way back out.
            if jq -e '.labels[] | select(.name == "hold")' <<< "$meta" > /dev/null; then
              echo "on hold - leaving for a maintainer"; echo "::endgroup::"; continue
            fi

            # Read as data. The working tree stays on main.
            git fetch --no-tags --quiet origin "refs/pull/$n/head"
            head_sha=$(git rev-parse FETCH_HEAD)
            if ! git show "${head_sha}:registry.json" > "$RUNNER_TEMP/head.json" 2>/dev/null; then
              echo "no registry.json on this branch - skipped"; echo "::endgroup::"; continue
            fi
            # What the contributor started from. Without it an entry they
            # deliberately edited is indistinguishable from a stale copy.
            base_sha=$(git merge-base HEAD "$head_sha")
            git show "${base_sha}:registry.json" > "$RUNNER_TEMP/base.json" 2>/dev/null || echo "[]" > "$RUNNER_TEMP/base.json"
            cp registry.json "$RUNNER_TEMP/main.json"

            if ! MAIN="$RUNNER_TEMP/main.json" BASE="$RUNNER_TEMP/base.json" HEAD="$RUNNER_TEMP/head.json" \
                 SUMMARY="$RUNNER_TEMP/summary.json" \
                 node scripts/merge-registry.mjs > "$RUNNER_TEMP/merged.json"; then
              gh pr comment "$n" --body "This branch's \`registry.json\` could not be read - it has unresolved conflict markers, or it is not valid JSON. Fix it on the branch and this will pick it up again."
              echo "::endgroup::"; continue
            fi

            added=$(jq -r '.added | join(" ")' "$RUNNER_TEMP/summary.json")
            updated=$(jq -r '.updated | join(" ")' "$RUNNER_TEMP/summary.json")
            author=$(jq -r '.author.login' <<< "$meta")

            if [ -z "$added" ] && [ -z "$updated" ]; then
              echo "adds nothing and changes nothing - already on main"; echo "::endgroup::"; continue
            fi

            # Appending your own project is bookkeeping. Rewriting a row that is
            # already in the table is a claim about someone else's project - one
            # of the fields it can change is the contact the team is reached on.
            # It lands unattended only if the author has a visible claim to the
            # row, checked against main and GitHub rather than the branch.
            if [ -n "$updated" ]; then
              if ! MAIN="$RUNNER_TEMP/main.json" UPDATED="$updated" AUTHOR="$author" \
                   node scripts/check-row-ownership.mjs; then
                gh pr comment "$n" --body "This changes rows that are already in the table (\`${updated}\`), and I cannot tell that they are yours - you are not listed in their \`team\` on main, and you do not own the repositories they point at. Leaving this for a maintainer. If it is your project, say so here."
                echo "changes rows it does not own - left for a maintainer"; echo "::endgroup::"; continue
              fi
            fi

            # Credited to the person who wrote it. The numeric id is what makes
            # GitHub attach the co-authorship to their account.
            author_id=$(gh api "users/$author" --jq '.id' 2>/dev/null)
            {
              echo "chore: register ${added:-$updated} (#$n)"
              echo
              echo "Applied from #$n by @$author, rebuilt on top of whatever else"
              echo "landed while it was open."
              if [ -n "$author_id" ]; then
                echo
                echo "Co-authored-by: $author <${author_id}+${author}@users.noreply.github.com>"
              fi
            } > "$RUNNER_TEMP/message.txt"

            # Anything at all can land on main between reading it and pushing -
            # another registration, a cron reindex, a maintainer. Deferring to
            # "the next run" left #16 open indefinitely, because the thing that
            # won the race did not touch registry.json and so started no run.
            # Rebuild against the new main and try again instead.
            sha=""
            for attempt in 1 2 3; do
              cp "$RUNNER_TEMP/merged.json" registry.json

              if ! node scripts/validate-registry.mjs; then
                gh pr comment "$n" --body "\`registry.json\` does not validate, so this is not going in yet. Every problem is listed in the Registrations run - push a fix to this branch and it will be applied on its own."
                git checkout --quiet -- registry.json
                break
              fi
              if ! HISTORY_REF=origin/main node scripts/check-registry-retention.mjs; then
                gh pr comment "$n" --body "Applying this would drop a project that is already in the table, so it is on hold. The Registrations run says which one and prints the entry to put back."
                git checkout --quiet -- registry.json
                break
              fi

              git add registry.json
              git commit --quiet -F "$RUNNER_TEMP/message.txt"

              if git push origin HEAD:main; then
                sha=$(git rev-parse --short HEAD)
                break
              fi

              echo "main moved while applying - rebuilding on top of it (attempt $attempt)"
              git fetch --quiet origin main && git reset --hard --quiet origin/main
              cp registry.json "$RUNNER_TEMP/main.json"
              # Re-resolve against the registry as it is now: whatever won the
              # race may itself have added an entry this one has to sit after.
              MAIN="$RUNNER_TEMP/main.json" BASE="$RUNNER_TEMP/base.json" HEAD="$RUNNER_TEMP/head.json" \
                SUMMARY="$RUNNER_TEMP/summary.json" \
                node scripts/merge-registry.mjs > "$RUNNER_TEMP/merged.json" || break
            done

            if [ -z "$sha" ]; then
              echo "not applied this run"; echo "::endgroup::"; continue
            fi

            {
              echo "Applied to main as \`${sha}\` - your project is on the hub within the half hour."
              echo
              echo "Closed rather than merged because the entry was rebuilt on top of everything else that landed while this was open. That is what stops registrations from deleting each other, and it means you never had to resolve a conflict. The commit is credited to you."
            } > "$RUNNER_TEMP/closing.md"
            gh pr comment "$n" --body-file "$RUNNER_TEMP/closing.md"
            gh pr close "$n"
            applied=1
            echo "applied as $sha"
            echo "::endgroup::"
          done

          # A push made with GITHUB_TOKEN does not start another workflow, so
          # the rebuild has to be asked for. Without this the hub waits for the
          # half-hourly cron instead.
          if [ "$applied" = "1" ]; then
            gh workflow run "Index projects" && echo "asked for a projects.json rebuild" \
              || echo "could not ask for a rebuild - the half-hourly cron will do it"
          fi

          # Whether a registration was rejected, or the rebuild could not be
          # asked for, the run itself did its job. Only a crash above is a
          # failure, and those exit on their own.
          exit 0
